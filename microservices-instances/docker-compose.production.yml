services:
  notifications-gateway:
    build:
      context: ./notifications-gateway/NotificationsGateway
      dockerfile: Dockerfile
    container_name: notifications-gateway
    ports:
      - "7000:8080"
    environment:
      DOTNET_ENVIRONMENT: "Production"
      DatabaseConnections__ConnectionString: "Host=192.168.2.113;Database=[database_name];Username=postgres;Password=postgres;Port=7050;"
      DatabaseConnections__DatabaseName: "notifications_db"
    restart: unless-stopped
  
  email-service:
    build:
      context: ./email-service/EmailService
      dockerfile: Dockerfile
    container_name: email-service
    ports:
      - "8000:8080"
    environment:
      DatabaseConnections__Messages__ConnectionString: "Host=192.168.2.113;Database=[database_name];Username=postgres;Password=postgres;Port=9050;"
      DatabaseConnections__Messages__DatabaseName: "messages_db"
      DatabaseConnections__Notifications__ConnectionString: "Host=192.168.2.113;Database=[database_name];Username=postgres;Password=postgres;Port=7050;"
      DatabaseConnections__Notifications__DatabaseName: "notifications_db"
      DOTNET_ENVIRONMENT: "Production"
    restart: unless-stopped
  
  sms-service:
    build:
      context: ./sms-service/SmsService
      dockerfile: Dockerfile
    container_name: sms-service
    ports:
      - "9000:8080"
    environment:
      DatabaseConnections__Messages__ConnectionString: "Host=192.168.2.113;Database=[database_name];Username=postgres;Password=postgres;Port=9050;"
      DatabaseConnections__Messages__DatabaseName: "messages_db"
      DatabaseConnections__Notifications__ConnectionString: "Host=192.168.2.113;Database=[database_name];Username=postgres;Password=postgres;Port=7050;"
      DatabaseConnections__Notifications__DatabaseName: "notifications_db"
      DOTNET_ENVIRONMENT: "Production"
    restart: unless-stopped
  
  push-service:
    build:
      context: ./push-service/PushService
      dockerfile: Dockerfile
    container_name: push-service
    ports:
      - "10000:8080"
    environment:
      DatabaseConnections__Messages__ConnectionString: "Host=192.168.2.113;Database=[database_name];Username=postgres;Password=postgres;Port=9050;"
      DatabaseConnections__Messages__DatabaseName: "messages_db"
      DatabaseConnections__Notifications__ConnectionString: "Host=192.168.2.113;Database=[database_name];Username=postgres;Password=postgres;Port=7050;"
      DatabaseConnections__Notifications__DatabaseName: "notifications_db"
      DOTNET_ENVIRONMENT: "Production"
    restart: unless-stopped