services:
  notifications-gateway:
    build:
      context: ./NotificationsGateway
      dockerfile: Dockerfile
    container_name: notifications-gateway
    depends_on:
      - notifications-db
    ports:
      - "7000:8080"
    environment:
      DOTNET_ENVIRONMENT: "Production"
      DatabaseConnections__ConnectionString: "Host=notifications-db;Database=[database_name];Username=postgres;Password=postgres;Port=5432;"
      DatabaseConnections__DatabaseName: "notifications_db"
    restart: unless-stopped
  
  notifications-db:
    image: postgres:17
    container_name: notifications-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notifications_db
    ports:
      - "7050:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: