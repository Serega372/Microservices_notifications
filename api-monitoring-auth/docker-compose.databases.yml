services:
  notifications-db:
    image: postgres:17
    container_name: notifications-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notifications_db
    ports:
      - "7050:5432"
    volumes:
      - db_notifications_data:/var/lib/postgresql/data
    restart: unless-stopped
  
  messages-db:
    image: postgres:17
    container_name: messages-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: messages_db
    ports:
      - "9050:5432"
    volumes:
      - db_messages_data:/var/lib/postgresql/data
    restart: unless-stopped
  
  auth-db:
    image: postgres:17
    container_name: auth-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_db
    ports:
      - "6050:5432"
    volumes:
      - db_auth_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  db_notifications_data:
  db_messages_data:
  db_auth_data: