services:
  sms-service:
    build:
      context: ./SmsService
      dockerfile: Dockerfile
    container_name: sms-service
    depends_on:
      - messages-db
    ports:
      - "9000:8080"
    environment:
      DatabaseConnections__Messages__ConnectionString: "Host=messages-db;Database=[database_name];Username=postgres;Password=postgres;Port=5432;"
      DatabaseConnections__Messages__DatabaseName: "messages_db"
      DatabaseConnections__Notifications__ConnectionString: "Host=192.168.2.111;Database=[database_name];Username=postgres;Password=postgres;Port=7050;"
      DatabaseConnections__Notifications__DatabaseName: "notifications_db"
      DOTNET_ENVIRONMENT: "Production"
  
  messages-db:
    image: postgres:17
    container_name: messages-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: messages_db
    ports:
      - "9050:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
        
volumes:
  db_data: